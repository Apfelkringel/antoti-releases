name: Probe gehostete Runner
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-latest, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: sw_vers; uname -m; echo "läuft auf ${{ matrix.os }}"
