# Baut die Installer von Antoti auf Rechnern von GitHub, für jedes System auf seinem eigenen: Windows, macOS
# (Apple Silicon) und Linux. Dafür braucht es weder den Windows-PC noch den Mac des Herstellers.
#
# Der Quellcode kommt aus dem privaten Repository Apfelkringel/antoti, mit einem Deploy-Key, der nur lesen darf
# (Secret ANTOTI_SOURCE_KEY). Der Google-Client für Kunden (ANTOTI_GOOGLE_CLIENT) steckt ohnehin in jedem Installer.
#
# Das Manifest wird hier nicht signiert: Der Workflow legt die Dateien in einen Entwurf v<Version>. Das Manifest
# signiert der Hersteller mit seinem Schlüssel außerhalb von GitHub (scripts/release.py sign im Repository antoti) und
# veröffentlicht erst dann. So kann auch jemand, der dieses Konto übernimmt, keinem Gerät ein Update unterschieben.
#
# Die App für macOS trägt dagegen hier eine Codesignatur mit dem festen, selbst ausgestellten Zertifikat „Antoti“
# (Secrets ANTOTI_MAC_SIGN_P12, ANTOTI_MAC_SIGN_PASSWORD). Ad hoc signiert wäre jede Fassung für macOS eine neue App,
# und Freigaben wie der Zugriff auf Wechselmedien gingen bei jedem Update verloren.
#
# Starten: Actions › „Installer bauen“ › Run workflow, oder
#   gh workflow run build.yml -R Apfelkringel/antoti-releases -f ref=<Commit oder Branch>
name: Installer bauen
# Der Name nennt den Stand, damit scripts/daily_release.py in antoti seinen eigenen Lauf erkennt.
run-name: Installer bauen ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, Branch oder Tag im Repository antoti
        required: true
        default: main
      platforms:
        description: Welche Systeme (Leerzeichen dazwischen)
        required: true
        default: windows-x86_64 darwin-arm64 linux-x86_64
      release:
        description: Die Dateien in den Entwurf v<Version> legen (sonst nur als Artefakte des Laufs)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: false

env:
  # SHA-1 des Zertifikats „Antoti“; ein anderes Zertifikat im Secret lässt codesign scheitern, statt still zu wechseln.
  MAC_SIGN_SHA1: C88DEC56D38D5ED5D6019109B3AC87399DC4308C
  INNO_VERSION: 6.7.1
  # SHA-256 des NuGet-Pakets Tools.InnoSetup 6.7.1; dasselbe ISCC.exe, mit dem bisher gebaut wurde.
  INNO_SHA256: 00a5a07e8a4bd3a30364cb579d744677b37adfc22e365099cb01b8bd1e651828

jobs:
  plan:
    name: Systeme wählen
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {"windows-x86_64": "windows-latest", "darwin-arm64": "macos-latest", "linux-x86_64": "ubuntu-latest"}
          wanted = os.environ["PLATFORMS"].split()
          unknown = [name for name in wanted if name not in runners]
          if unknown or not wanted:
              raise SystemExit("Unbekannte oder keine Systeme: %s (bekannt: %s)" % (unknown, " ".join(runners)))
          print("matrix=" + json.dumps({"include": [{"platform": name, "runner": runners[name]} for name in wanted]}))
          EOF

  build:
    name: ${{ matrix.platform }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v5
        with:
          repository: Apfelkringel/antoti
          ssh-key: ${{ secrets.ANTOTI_SOURCE_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: antoti

      # actions/checkout nimmt keine abgekürzten Commits; git löst Kürzel, Branch und Tag gleich auf.
      - name: Stand wählen
        working-directory: antoti
        env:
          REF: ${{ inputs.ref }}
        run: |
          commit=$(git rev-parse --verify --quiet "$REF^{commit}" || git rev-parse --verify --quiet "origin/$REF^{commit}") \
            || { echo "::error::$REF ist im Repository antoti weder Commit noch Branch noch Tag."; exit 1; }
          git checkout --quiet --detach "$commit"
          git status --short | head -5

      - name: Python für die Bauskripte
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Version
        id: version
        working-directory: antoti
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Antoti $version aus $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Google-Client
        env:
          GOOGLE_CLIENT: ${{ secrets.ANTOTI_GOOGLE_CLIENT }}
        run: |
          if [ -z "$GOOGLE_CLIENT" ]; then echo "::error::Secret ANTOTI_GOOGLE_CLIENT fehlt."; exit 1; fi
          printf '%s' "$GOOGLE_CLIENT" > "$RUNNER_TEMP/google-client.json"

      - name: Signierzertifikat (macOS)
        if: matrix.platform == 'darwin-arm64'
        env:
          P12: ${{ secrets.ANTOTI_MAC_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.ANTOTI_MAC_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::Secrets ANTOTI_MAC_SIGN_P12 und ANTOTI_MAC_SIGN_PASSWORD fehlen."; exit 1
          fi
          keychain="$RUNNER_TEMP/antoti-sign.keychain-db"
          password=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/antoti-sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/antoti-sign.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/antoti-sign.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "ANTOTI_MAC_SIGN_IDENTITY=$MAC_SIGN_SHA1" >> "$GITHUB_ENV"

      - name: Paket bauen
        working-directory: antoti
        # Ohne --platform baut das Skript für das System, auf dem es läuft; --platform hieße nur laden.
        run: python scripts/build_bundle.py --google-client "$RUNNER_TEMP/google-client.json"

      - name: Inno Setup
        if: matrix.platform == 'windows-x86_64'
        run: |
          package="$RUNNER_TEMP/innosetup.nupkg"
          curl -fsSL --retry 5 -o "$package" "https://www.nuget.org/api/v2/package/Tools.InnoSetup/$INNO_VERSION"
          echo "$INNO_SHA256  $package" | sha256sum -c -
          python -m zipfile -e "$package" "$RUNNER_TEMP/innosetup"
          echo "ANTOTI_ISCC=$(cygpath -w "$RUNNER_TEMP/innosetup/tools/ISCC.exe")" >> "$GITHUB_ENV"

      - name: Installer bauen (Windows)
        if: matrix.platform == 'windows-x86_64'
        working-directory: antoti
        run: python scripts/build_windows_installer.py

      - name: Installer bauen (macOS, Linux)
        if: matrix.platform != 'windows-x86_64'
        working-directory: antoti
        run: python scripts/build_posix_package.py

      - name: Signatur prüfen (macOS)
        if: matrix.platform == 'darwin-arm64'
        working-directory: antoti/build/installer
        run: |
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" Antoti-*-macos-arm64.dmg > /dev/null
          codesign --verify --deep --strict "$mount/Antoti.app"
          requirement=$(codesign -d -r- "$mount/Antoti.app" 2>&1)
          hdiutil detach "$mount" > /dev/null
          echo "$requirement"
          root=$(echo "$MAC_SIGN_SHA1" | tr 'A-F' 'a-f')
          case "$requirement" in
            *"identifier \"com.antoti.desktop\" and certificate root = H\"$root\""*) ;;
            *) echo "::error::Die App trägt nicht die Signatur des Zertifikats Antoti."; exit 1 ;;
          esac

      - name: Signierzertifikat entfernen
        if: always() && matrix.platform == 'darwin-arm64'
        run: security delete-keychain "$RUNNER_TEMP/antoti-sign.keychain-db" 2>/dev/null || true

      - name: Google-Client entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/google-client.json"

      - name: Prüfsumme
        working-directory: antoti/build/installer
        run: |
          ls -la
          for file in Antoti*; do
            size=$(wc -c < "$file" | tr -d ' ')
            sha256=$(python -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$file")
            echo "\`$file\` $size Bytes, SHA-256 $sha256" >> "$GITHUB_STEP_SUMMARY"
            # scripts/daily_release.py in antoti vergleicht diese Annotation mit dem Digest, den GitHub für die Datei im
            # Entwurf nennt, statt beide Dateien zu laden. Wer nur Releases schreiben darf, kann sie nicht ändern.
            echo "::notice title=Installer::$file $size $sha256"
          done

      - name: Datei ablegen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: antoti/build/installer/Antoti*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Entwurf v${{ needs.build.outputs.version }}
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dateien holen
        uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: In den Entwurf legen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          ls -la files
          if ! state=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --title "Antoti $VERSION" \
              --notes "Entwurf aus „Installer bauen“. Wird veröffentlicht, sobald der Hersteller das Manifest signiert hat." \
              files/*
          elif [ "$state" = "true" ]; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber files/*
          else
            # Ein veröffentlichtes Release bekommt nur Dateien, die ihm fehlen; was Geräte schon laden, bleibt.
            existing=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for file in files/*; do
              if grep -qxF "$(basename "$file")" <<< "$existing"; then
                echo "::warning::$tag ist veröffentlicht und hat $(basename "$file") schon; die Datei bleibt, wie sie ist."
              else
                gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$file"
              fi
            done
          fi
          {
            echo "Dateien liegen bei $tag. Signieren und veröffentlichen (im Repository antoti, mit dem Schlüssel des Herstellers):"
            echo '```'
            echo "gh release download $tag -R $GITHUB_REPOSITORY -p 'Antoti*' -D build/release-files"
            echo "scripts/release.py sign --since <älteste Version, die ein Gerät noch hat> \\"
            for file in files/*; do
              name=$(basename "$file")
              case "$name" in
                *Setup*.exe) platform=windows-x86_64 ;;
                *macos-arm64.dmg) platform=darwin-arm64 ;;
                *linux-x86_64.tar.gz) platform=linux-x86_64 ;;
                *) continue ;;
              esac
              echo "  --artifact $platform=build/release-files/$name \\"
            done
            echo "  --out build/release/$VERSION/antoti-release.json"
            echo "gh release upload $tag -R $GITHUB_REPOSITORY build/release/$VERSION/antoti-release.json"
            echo "gh release edit $tag -R $GITHUB_REPOSITORY --draft=false --latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
