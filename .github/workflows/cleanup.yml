# Hier gibt es nur ein Release: das neueste. Sobald eines veröffentlicht ist, löscht dieser Workflow alle anderen
# mit älterer Version samt Tag, auch liegengebliebene Entwürfe. Geräte (src/antoti/updates.py), die Knöpfe der Website
# und install-mac.sh lesen nur releases/latest; ältere Fassungen braucht keiner von ihnen.
# Was eine neuere Version hat, bleibt: ein Bau, der noch signiert wird, oder ein Release, das gerade erscheint und
# danach selbst aufräumt. Einen älteren Entwurf veröffentlicht scripts/daily_release.py ohnehin nicht mehr.
#
# Von Hand: Actions › „Alte Releases löschen“ › Run workflow; „nur anzeigen“ nennt die Releases, ohne zu löschen.
name: Alte Releases löschen

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      nur_anzeigen:
        description: Nur anzeigen, was gelöscht würde
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Nur das neueste behalten
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.nur_anzeigen || false }}
        run: |
          set -euo pipefail
          latest=$(gh release view -R "$REPO" --json tagName --jq .tagName)
          # Ohne Manifest im neuesten Release bekommen die Geräte kein Update; dann lieber nichts anfassen.
          assets=$(gh release view "$latest" -R "$REPO" --json assets --jq '.assets[].name')
          if ! grep -qxF antoti-release.json <<< "$assets"; then
            echo "::error::$latest hat kein antoti-release.json; es wird nichts gelöscht."
            exit 1
          fi
          echo "Neuestes Release: $latest" | tee -a "$GITHUB_STEP_SUMMARY"
          releases=$(gh release list -R "$REPO" --limit 1000 --json tagName,isDraft --jq '.[] | "\(.tagName) \(.isDraft)"')
          failed=0
          while read -r tag draft; do
            [ -n "$tag" ] && [ "$tag" != "$latest" ] || continue
            if [ "$(printf '%s\n%s\n' "${latest#v}" "${tag#v}" | sort -V | tail -n1)" = "${tag#v}" ]; then
              echo "Bleibt: $tag (Entwurf: $draft) ist neuer als $latest." | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "Würde löschen: $tag (Entwurf: $draft)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Ein Entwurf hat noch keinen Tag; nur ein veröffentlichtes Release nimmt seinen mit.
            cleanup=(--cleanup-tag)
            [ "$draft" = true ] && cleanup=()
            if gh release delete "$tag" -R "$REPO" --yes "${cleanup[@]}"; then
              echo "Gelöscht: $tag (Entwurf: $draft)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$tag ließ sich nicht löschen."
              failed=1
            fi
          done <<< "$releases"
          exit "$failed"
