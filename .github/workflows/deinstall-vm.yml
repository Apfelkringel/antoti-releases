# Prüft auf frischen Windows-VMs, was die Deinstallation von Antoti mit den Daten macht (test/deinstall_vm.py): einmal
# „behalten“, einmal „löschen“ und einmal still. Start von Hand, mit dem Installer des neuesten Releases oder eines
# Laufs von build.yml (release=false). Kein Geheimnis, kein Kontakt zum Tresor des Herstellers.
name: Deinstallation und Daten (Windows-VM)
run-name: Deinstallation ${{ inputs.bau || 'neuestes Release' }}

on:
  workflow_dispatch:
    inputs:
      bau:
        description: Lauf-ID von build.yml mit dem Installer (leer = neuestes Release)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  deinstall:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        daten: [behalten, loeschen, still]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Installer holen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BAU: ${{ inputs.bau }}
        run: |
          if ($env:BAU) { gh run download $env:BAU -R $env:REPO -n windows-x86_64 -D setup }
          else { gh release download -R $env:REPO -p 'Antoti-Setup-*.exe' -D setup }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem setup | ForEach-Object { "{0} {1}" -f $_.Name, (Get-FileHash $_.FullName).Hash }

      - name: Installieren, deinstallieren, Daten prüfen
        env:
          ANTOTI_TRESOR_URL: "off"
        run: |
          python -m pip install --disable-pip-version-check --quiet pywinauto
          $setup = (Get-ChildItem setup -Filter Antoti-Setup-*.exe | Select-Object -First 1).FullName
          python test/deinstall_vm.py --setup $setup --daten ${{ matrix.daten }} --arbeit arbeit

      - name: Bericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deinstall-vm-${{ matrix.daten }}
          path: arbeit
          if-no-files-found: warn
